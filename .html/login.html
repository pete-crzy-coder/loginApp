<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <link rel="stylesheet" href="css/0xprotonerdfont.css">
    <style>
        :root {
            --bg: #0e0f14;
            --sidebar: #151821;
            --accent: #6c8cff;
            --text: #e6e8f0;
            --muted: #9aa0b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "0xProto Nerd Font", Inter, system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        /* Background video */
        #myVideo {
            position: fixed;
            inset: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Main login card */
        #main {
            display: grid;
            gap: 16px;
            padding: 32px;
            width: 100%;
            max-width: 360px;
            background: rgba(21, 24, 33, 0.85);
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        /* Form layout */
        #form {
            display: grid;
            gap: 10px;
        }

        h1 {
            font-size: 28px;
        }

        #reminder {
            font-size: 14px;
            color: var(--muted);
        }

        label {
            font-size: 12px;
            text-align: left;
            color: var(--muted);
        }

        #bob {
            font-size: 14px;
            color: var(--muted);
        }

        input[type="text"],
        input[type="password"],
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            outline: none;
            font-size: 15px;
        }

        input[type="submit"] {
            background: var(--accent);
            color: white;
            cursor: pointer;
        }
    </style>
    <script src="/js/unstable.js"></script>
</head>

<body>
    <video autoplay muted loop id="myVideo" loop>
        <source src="/media/1.mp4" type="video/mp4">
    </video>
    <div id="main">
        <h1>Login Page</h1>
        <form id="form" method="post" action="/api/user/login">
            <label for="auth">Username / Email:</label>
            <input type="text" id="auth" name="auth" autocomplete="on"><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <p id="bob"></p>
            <script>
                const bob = document.getElementById("bob");
                const humour = [
                    '<b>Forgot your password?</b><br>Yeah… that’s between you and past-you 😌',
                    '<b>Forgot your password?</b><br>Tragic. Truly. 😏',
                    '<b>Forgot your password?</b><br>Skill issue. 😎',
                    '<b>Forgot your password?</b><br>Well, if you can’t remember it, I can’t help you. 😶‍🌫️',
                    '<b>Forgot your password?</b><br>That’s rough. 😔',
                    '<b>Forgot your password?</b><br>Time to make a new one! 🥳 (Which is not possible)',
                    '<b>Forgot your password?</b><br>Happens to the best of us. Unfortunately.',
                    '<b>Forgot your password?</b><br>That sounds like a <i>you</i> problem.',
                    '<b>Forgot your password?</b><br>Don’t worry, it happens to everyone. Just not to me. 😎',
                    '<b>Forgot your password?</b><br>It’s okay, you can just reset it! Oh wait, you can’t. 😬',
                    '<b>Forgot your password?</b><br>Well, that’s not good. 😕',
                    '<b>Forgot your password?</b><br>Maybe try remembering it? Just a thought. 🤔',
                    '<b>Forgot your password?</b><br>That’s unfortunate. 😢',
                    '<b>Forgot your password?</b><br>It’s like you don’t even know yourself. 😶‍🌫️',
                    '<b>Forgot your password?</b><br>Well, that’s a shame. 😞',
                    '<b>Forgot your password?</b><br>Maybe try writing it down next time? Just a suggestion. 📝',
                ]
                bob.innerHTML = humour[Math.floor(Math.random() * humour.length)];
            </script>
            <input type="submit" value="Login">
        </form>
        <p id="reminder">
            Don’t have an account?
            <a href="/signup">Sign up.</a>
        </p>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <style>
        :root {
            --bg: #0e0f14;
            --sidebar: #151821;
            --accent: #6c8cff;
            --text: #e6e8f0;
            --muted: #9aa0b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 220px;
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        #sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        #sidebar a {
            color: var(--text);
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        #sidebar a:hover {
            background: rgba(108, 140, 255, 0.2);
        }

        /* Header */
        #header {
            height: 60px;
            background: linear-gradient(135deg, #151821, #1b1f2b);
            display: flex;
            align-items: center;
            padding: 0 20px;
            flex-shrink: 0;
            width: 100%;
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* Layout */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
    <script src="/js/unstable.js"></script>
</head>

<body>
    <div id="sidebar">
        <h2>Menu</h2>
        <a href="#">Explore</a>
        <a href="#">Dashboard</a>
        <a href="#">Projects</a>
        <a href="#">Settings</a>
        <a href="#">Profile</a>
        <a href="/api/user/logout">Logout</a>
    </div>

    <div id="main">
        <div id="header">
            Login App
        </div>
        <!-- Main content goes here -->
    </div>
</body>

</html>
